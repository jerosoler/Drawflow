<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Drawflow | Simple Flow program libray</title>
    <meta name="description"
          content="Simple library for flow programming. Drawflow allows you to create data flows easily and quickly.">
</head>
<body>
<script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/js/all.min.js"
        integrity="sha256-KzZiKy0DWYsnwMF+X1DvQngQ2/FxF7MF3Ff72XcpuPs=" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow@0.0.48/dist/drawflow.min.css">
<link rel="stylesheet" type="text/css" href="beautiful.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css"
      integrity="sha256-h20CPZ0QyXlBuAw7A+KluUYx/3pK+c7lYEpqLTlxjYQ=" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
<script src="https://unpkg.com/micromodal/dist/micromodal.min.js"></script>

<div class="wrapper">
    <div class="col">
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="facebook">
            <i class="fab fa-facebook"></i><span> Facebook</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="slack">
            <i class="fab fa-slack"></i><span> Slack receive message</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="github">
            <i class="fab fa-github"></i><span> Github Star</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="telegram">
            <i class="fab fa-telegram"></i><span> Telegram send message</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="aws">
            <i class="fab fa-aws"></i><span> AWS</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="log">
            <i class="fas fa-file-signature"></i><span> File Log</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="google">
            <i class="fab fa-google-drive"></i><span> Google Drive save</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="email">
            <i class="fas fa-at"></i><span> Email send</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="template">
            <i class="fas fa-code"></i><span> Template</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="multiple">
            <i class="fas fa-code-branch"></i><span> Multiple inputs/outputs</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="personalized">
            <i class="fas fa-fill"></i><span> Personalized</span>
        </div>
        <div class="drag-drawflow" draggable="true" ondragstart="drag(event)" data-node="dbclick">
            <i class="fas fa-mouse"></i><span> DBClick!</span>
        </div>


    </div>
    <div class="col-right">
        <div id="drawflow" ondrop="drop(event)" ondragover="allowDrop(event)">
            <div class="btn-lock">
                <i id="lock" class="fas fa-lock" onclick="editor.editor_mode='fixed'; changeMode('lock');"></i>
                <i id="unlock" class="fas fa-lock-open" onclick="editor.editor_mode='edit'; changeMode('unlock');"
                   style="display:none;"></i>
            </div>
            <div class="bar-zoom">
                <i class="fas fa-search-minus" onclick="editor.zoom_out()"></i>
                <i class="fas fa-search" onclick="editor.zoom_reset()"></i>
                <i class="fas fa-search-plus" onclick="editor.zoom_in()"></i>
            </div>
        </div>
    </div>
</div>

<script>
    const id = document.getElementById("drawflow");
    const editor = new Drawflow(id);
    editor.reroute = true;
    const dataToImport = {
        "drawflow": {
            "Home": {
                "data": {
                    "2": {
                        "id": 2,
                        "name": "slack",
                        "data": {},
                        "class": "slack",
                        "html": "\n          <div>\n            <div class=\"title-box\"><i class=\"fab fa-slack\"></i> Slack chat message</div>\n          </div>\n          ",
                        "typenode": false,
                        "inputs": {"input_1": {"connections": [{"node": "7", "input": "output_1"}]}},
                        "outputs": {},
                        "pos_x": 1028,
                        "pos_y": 87
                    },
                    "3": {
                        "id": 3,
                        "name": "telegram",
                        "data": {"channel": "channel_2"},
                        "class": "telegram",
                        "html": "\n          <div>\n            <div class=\"title-box\"><i class=\"fab fa-telegram-plane\"></i> Telegram bot</div>\n            <div class=\"box\">\n              <p>Send to telegram</p>\n              <p>select channel</p>\n              <select df-channel>\n                <option value=\"channel_1\">Channel 1</option>\n                <option value=\"channel_2\">Channel 2</option>\n                <option value=\"channel_3\">Channel 3</option>\n                <option value=\"channel_4\">Channel 4</option>\n              </select>\n            </div>\n          </div>\n          ",
                        "typenode": false,
                        "inputs": {"input_1": {"connections": [{"node": "7", "input": "output_1"}]}},
                        "outputs": {},
                        "pos_x": 1032,
                        "pos_y": 184
                    },
                    "4": {
                        "id": 4,
                        "name": "email",
                        "data": {},
                        "class": "email",
                        "html": "\n            <div>\n              <div class=\"title-box\"><i class=\"fas fa-at\"></i> Send Email </div>\n            </div>\n            ",
                        "typenode": false,
                        "inputs": {"input_1": {"connections": [{"node": "5", "input": "output_1"}]}},
                        "outputs": {},
                        "pos_x": 1033,
                        "pos_y": 439
                    },
                    "5": {
                        "id": 5,
                        "name": "template",
                        "data": {"template": "Write your template"},
                        "class": "template",
                        "html": "\n            <div>\n              <div class=\"title-box\"><i class=\"fas fa-code\"></i> Template</div>\n              <div class=\"box\">\n                Ger Vars\n                <textarea df-template></textarea>\n                Output template with vars\n              </div>\n            </div>\n            ",
                        "typenode": false,
                        "inputs": {"input_1": {"connections": [{"node": "6", "input": "output_1"}]}},
                        "outputs": {
                            "output_1": {
                                "connections": [{"node": "4", "output": "input_1"}, {
                                    "node": "11",
                                    "output": "input_1"
                                }]
                            }
                        },
                        "pos_x": 607,
                        "pos_y": 304
                    },
                    "6": {
                        "id": 6,
                        "name": "github",
                        "data": {"name": "https://github.com/jerosoler/Drawflow"},
                        "class": "github",
                        "html": "\n          <div>\n            <div class=\"title-box\"><i class=\"fab fa-github \"></i> Github Stars</div>\n            <div class=\"box\">\n              <p>Enter repository url</p>\n            <input type=\"text\" df-name>\n            </div>\n          </div>\n          ",
                        "typenode": false,
                        "inputs": {},
                        "outputs": {"output_1": {"connections": [{"node": "5", "output": "input_1"}]}},
                        "pos_x": 341,
                        "pos_y": 191
                    },
                    "7": {
                        "id": 7,
                        "name": "facebook",
                        "data": {},
                        "class": "facebook",
                        "html": "\n        <div>\n          <div class=\"title-box\"><i class=\"fab fa-facebook\"></i> Facebook Message</div>\n        </div>\n        ",
                        "typenode": false,
                        "inputs": {},
                        "outputs": {
                            "output_1": {
                                "connections": [{"node": "2", "output": "input_1"}, {
                                    "node": "3",
                                    "output": "input_1"
                                }, {"node": "11", "output": "input_1"}]
                            }
                        },
                        "pos_x": 347,
                        "pos_y": 87
                    },
                    "11": {
                        "id": 11,
                        "name": "log",
                        "data": {},
                        "class": "log",
                        "html": "\n            <div>\n              <div class=\"title-box\"><i class=\"fas fa-file-signature\"></i> Save log file </div>\n            </div>\n            ",
                        "typenode": false,
                        "inputs": {
                            "input_1": {
                                "connections": [{"node": "5", "input": "output_1"}, {
                                    "node": "7",
                                    "input": "output_1"
                                }]
                            }
                        },
                        "outputs": {},
                        "pos_x": 1031,
                        "pos_y": 363
                    }
                }
            }, "Other": {
                "data": {
                    "8": {
                        "id": 8,
                        "name": "personalized",
                        "data": {},
                        "class": "personalized",
                        "html": "\n            <div>\n              Personalized\n            </div>\n            ",
                        "typenode": false,
                        "inputs": {
                            "input_1": {
                                "connections": [{"node": "12", "input": "output_1"}, {
                                    "node": "12",
                                    "input": "output_2"
                                }, {"node": "12", "input": "output_3"}, {"node": "12", "input": "output_4"}]
                            }
                        },
                        "outputs": {"output_1": {"connections": [{"node": "9", "output": "input_1"}]}},
                        "pos_x": 764,
                        "pos_y": 227
                    },
                    "9": {
                        "id": 9,
                        "name": "dbclick",
                        "data": {"name": "Hello World!!"},
                        "class": "dbclick",
                        "html": "\n            <div>\n            <div class=\"title-box\"><i class=\"fas fa-mouse\"></i> Db Click</div>\n              <div class=\"box dbclickbox\" ondblclick=\"showpopup(event)\">\n                Db Click here\n                <div class=\"modal\" style=\"display:none\">\n                  <div class=\"modal-content\">\n                    <span class=\"close\" onclick=\"closemodal(event)\">&times;</span>\n                    Change your variable {name} !\n                    <input type=\"text\" df-name>\n                  </div>\n\n                </div>\n              </div>\n            </div>\n            ",
                        "typenode": false,
                        "inputs": {"input_1": {"connections": [{"node": "8", "input": "output_1"}]}},
                        "outputs": {"output_1": {"connections": [{"node": "12", "output": "input_2"}]}},
                        "pos_x": 209,
                        "pos_y": 38
                    },
                    "12": {
                        "id": 12,
                        "name": "multiple",
                        "data": {},
                        "class": "multiple",
                        "html": "\n            <div>\n              <div class=\"box\">\n                Multiple!\n              </div>\n            </div>\n            ",
                        "typenode": false,
                        "inputs": {
                            "input_1": {"connections": []},
                            "input_2": {"connections": [{"node": "9", "input": "output_1"}]},
                            "input_3": {"connections": []}
                        },
                        "outputs": {
                            "output_1": {"connections": [{"node": "8", "output": "input_1"}]},
                            "output_2": {"connections": [{"node": "8", "output": "input_1"}]},
                            "output_3": {"connections": [{"node": "8", "output": "input_1"}]},
                            "output_4": {"connections": [{"node": "8", "output": "input_1"}]}
                        },
                        "pos_x": 179,
                        "pos_y": 272
                    }
                }
            }
        }
    }

    editor.start();
    editor.import(dataToImport);

    const elements = document.getElementsByClassName('drag-drawflow');
    for (let i = 0; i < elements.length; i++) {
        elements[i].addEventListener('touchend', drop, false);
        elements[i].addEventListener('touchmove', positionMobile, false);
        elements[i].addEventListener('touchstart', drag, false);
    }

    let mobile_item_selec = '';
    let mobile_last_move = null;

    function positionMobile(ev) {
        mobile_last_move = ev;
    }

    function allowDrop(ev) {
        ev.preventDefault();
    }

    function drag(ev) {
        if (ev.type === "touchstart") {
            mobile_item_selec = ev.target.closest(".drag-drawflow").getAttribute('data-node');
        } else {
            ev.dataTransfer.setData("node", ev.target.getAttribute('data-node'));
        }
    }

    function drop(ev) {
        if (ev.type === "touchend") {
            const parentdrawflow = document.elementFromPoint(mobile_last_move.touches[0].clientX, mobile_last_move.touches[0].clientY).closest("#drawflow");
            if (parentdrawflow != null) {
                addNodeToDrawFlow(mobile_item_selec, mobile_last_move.touches[0].clientX, mobile_last_move.touches[0].clientY);
            }
            mobile_item_selec = '';
        } else {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("node");
            addNodeToDrawFlow(data, ev.clientX, ev.clientY);
        }
    }

    function addNodeToDrawFlow(name, pos_x, pos_y) {
        if (editor.editor_mode === 'fixed') {
            return false;
        }

        pos_x = pos_x * (editor.precanvas.clientWidth / (editor.precanvas.clientWidth * editor.zoom)) - (editor.precanvas.getBoundingClientRect().x * (editor.precanvas.clientWidth / (editor.precanvas.clientWidth * editor.zoom)));
        pos_y = pos_y * (editor.precanvas.clientHeight / (editor.precanvas.clientHeight * editor.zoom)) - (editor.precanvas.getBoundingClientRect().y * (editor.precanvas.clientHeight / (editor.precanvas.clientHeight * editor.zoom)));

        switch (name) {
            case 'facebook':
                var facebook = `
        <div>
          <div class="title-box"><i class="fab fa-facebook"></i> Facebook Message</div>
        </div>
        `;
                editor.addNode('facebook', 0, 1, pos_x, pos_y, 'facebook', {}, facebook);
                break;
            case 'slack':
                var slackchat = `
          <div>
            <div class="title-box"><i class="fab fa-slack"></i> Slack chat message</div>
          </div>
          `
                editor.addNode('slack', 1, 0, pos_x, pos_y, 'slack', {}, slackchat);
                break;
            case 'github':
                var githubtemplate = `
          <div>
            <div class="title-box"><i class="fab fa-github "></i> Github Stars</div>
            <div class="box">
              <p>Enter repository url</p>
            <input type="text" df-name>
            </div>
          </div>
          `;
                editor.addNode('github', 0, 1, pos_x, pos_y, 'github', {"name": ''}, githubtemplate);
                break;
            case 'telegram':
                var telegrambot = `
          <div>
            <div class="title-box"><i class="fab fa-telegram-plane"></i> Telegram bot</div>
            <div class="box">
              <p>Send to telegram</p>
              <p>select channel</p>
              <select df-channel>
                <option value="channel_1">Channel 1</option>
                <option value="channel_2">Channel 2</option>
                <option value="channel_3">Channel 3</option>
                <option value="channel_4">Channel 4</option>
              </select>
            </div>
          </div>
          `;
                editor.addNode('telegram', 1, 0, pos_x, pos_y, 'telegram', {"channel": 'channel_3'}, telegrambot);
                break;
            case 'aws':
                var aws = `
          <div>
            <div class="title-box"><i class="fab fa-aws"></i> Aws Save </div>
            <div class="box">
              <p>Save in aws</p>
              <input type="text" df-db-dbname placeholder="DB name"><br><br>
              <input type="text" df-db-key placeholder="DB key">
              <p>Output Log</p>
            </div>
          </div>
          `;
                editor.addNode('aws', 1, 1, pos_x, pos_y, 'aws', {"db": {"dbname": '', "key": ''}}, aws);
                break;
            case 'log':
                var log = `
            <div>
              <div class="title-box"><i class="fas fa-file-signature"></i> Save log file </div>
            </div>
            `;
                editor.addNode('log', 1, 0, pos_x, pos_y, 'log', {}, log);
                break;
            case 'google':
                var google = `
            <div>
              <div class="title-box"><i class="fab fa-google-drive"></i> Google Drive save </div>
            </div>
            `;
                editor.addNode('google', 1, 0, pos_x, pos_y, 'google', {}, google);
                break;
            case 'email':
                var email = `
            <div>
              <div class="title-box"><i class="fas fa-at"></i> Send Email </div>
            </div>
            `;
                editor.addNode('email', 1, 0, pos_x, pos_y, 'email', {}, email);
                break;

            case 'template':
                var template = `
            <div>
              <div class="title-box"><i class="fas fa-code"></i> Template</div>
              <div class="box">
                Ger Vars
                <textarea df-template></textarea>
                Output template with vars
              </div>
            </div>
            `;
                editor.addNode('template', 1, 1, pos_x, pos_y, 'template', {"template": 'Write your template'}, template);
                break;
            case 'multiple':
                var multiple = `
            <div>
              <div class="box">
                Multiple!
              </div>
            </div>
            `;
                editor.addNode('multiple', 3, 4, pos_x, pos_y, 'multiple', {}, multiple);
                break;
            case 'personalized':
                var personalized = `
            <div>
              Personalized
            </div>
            `;
                editor.addNode('personalized', 1, 1, pos_x, pos_y, 'personalized', {}, personalized);
                break;
            case 'dbclick':
                var dbclick = `
            <div>
            <div class="title-box"><i class="fas fa-mouse"></i> Db Click</div>
              <div class="box dbclickbox" ondblclick="showpopup(event)">
                Db Click here
                <div class="modal" style="display:none">
                  <div class="modal-content">
                    <span class="close" onclick="closemodal(event)">&times;</span>
                    Change your variable {name} !
                    <input type="text" df-name>
                  </div>

                </div>
              </div>
            </div>
            `;
                editor.addNode('dbclick', 1, 1, pos_x, pos_y, 'dbclick', {name: ''}, dbclick);
                break;

            default:
        }
    }

    let transform = '';

    function changeMode(option) {
        if (option === 'lock') {
            lock.style.display = 'none';
            unlock.style.display = 'block';
        } else {
            lock.style.display = 'block';
            unlock.style.display = 'none';
        }
    }
</script>
</body>
</html>
